<!doctype html>
<html>
<head>
    <title>{{ folder['Name'] }} – Music Videos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* ==================== SEARCHBAR STYLES ==================== */
        .search-container {
            margin-bottom: 30px;
            max-width: 600px;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #333;
            border-radius: 6px;
            background: #1c1c1c;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #ff3d3d;
        }

        .search-btn {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            background: #ff3d3d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .search-btn:hover {
            background: #ff1f1f;
        }
    </style>
</head>
<body>

<!-- Searchbar -->
<div class="search-container">
    <form class="search-form" action="{{ url_for('search') }}" method="get">
        <input 
            type="text" 
            class="search-input" 
            name="query" 
            placeholder="Search shows, movies, albums..." 
            required
        >
        <button type="submit" class="search-btn">Search</button>
    </form>
</div>

<h1>{{ folder['Name'] }}</h1>

<div class="grid">
    {% for video in videos %}
    <div class="card">
        {% if video.ImageUrl %}
            <img src="{{ video.ImageUrl }}" alt="{{ video['Name'] }}">
        {% else %}
            <div class="placeholder">🎬</div>
        {% endif %}
        <div class="title">{{ video['Name'] }}</div>

        <div class="card-body">
            <form action="{{ url_for('download_single', library_name=library_name, single_id=video['Id']) }}" method="get">
                <button class="btn" type="submit">Download Video</button>
            </form>
        </div>
    </div>
    {% endfor %}
</div> <!-- close grid here -->

<!-- Pagination controls OUTSIDE the grid -->
<div class="pagination" style="margin: 20px auto; text-align: center; color: #fff; font-weight: bold; max-width: 300px;">
    {% if page > 1 %}
        <a href="{{ url_for('music_video_folder', library_name=library_name, folder_id=folder['Id'], page=page-1) }}" class="btn">← Previous</a>
    {% endif %}

    <span style="margin: 0 10px;">Page {{ page }} of {{ total_pages }}</span>

    {% if page < total_pages %}
        <a href="{{ url_for('music_video_folder', library_name=library_name, folder_id=folder['Id'], page=page+1) }}" class="btn">Next →</a>
    {% endif %}
</div>

<a href="{{ url_for('library', library_name=library_name) }}">← Back</a>

</body>
</html>
