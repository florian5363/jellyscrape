<!doctype html>
<html>
<head>
    <title>{{ show['Name'] }} – Seasons</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* ==================== SEARCHBAR STYLES ==================== */
        .search-container {
            margin-bottom: 30px;
            max-width: 600px;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #333;
            border-radius: 6px;
            background: #1c1c1c;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #ff3d3d;
        }

        .search-btn {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            background: #ff3d3d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .search-btn:hover {
            background: #ff1f1f;
        }
    </style>
</head>

<body>

<!-- Searchbar -->
<div class="search-container">
    <form class="search-form" action="{{ url_for('search') }}" method="get">
        <input 
            type="text" 
            class="search-input" 
            name="query" 
            placeholder="Search shows, movies, albums..." 
            required
        >
        <button type="submit" class="search-btn">Search</button>
    </form>
</div>

<h1>{{ show['Name'] }} – Seasons</h1>

<div class="grid">
    {% for season in seasons %}
    <div class="card">
        <a href="{{ url_for('season', library_name=library_name, season_id=season['Id']) }}">
            <img src="{{ season.get('ImageUrl') }}">
            <div class="title">
                Season {{ season.get('IndexNumber', '?') }}
            </div>
        </a>
    </div>
    {% endfor %}
</div>

<a href="{{ url_for('library', library_name=library_name) }}">← Back</a>

</body>
</html>
