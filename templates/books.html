<!doctype html>
<html>
<head>
    <title>{{ library_name }} – Books</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            padding: 20px;
        }
        
        /* ==================== SEARCHBAR STYLES ==================== */
        .search-container {
            margin-bottom: 30px;
            max-width: 600px;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #333;
            border-radius: 6px;
            background: #1c1c1c;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #ff3d3d;
        }

        .search-btn {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            background: #ff3d3d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .search-btn:hover {
            background: #ff1f1f;
        }
        
        /* ==================== GRID & CARDS ==================== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
            gap: 20px;
        }
        .card {
            background: #1c1c1c;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,.6);
            transition: transform 0.15s ease;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #333;
        }
        .card-body {
            padding: 10px;
            text-align: center;
        }
        .title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn {
            background: #ff3d3d;
            border: none;
            padding: 6px 10px;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn:hover {
            background: #ff1f1f;
        }
        a { color: inherit; text-decoration: none; }
    </style>
</head>
<body>

<!-- Searchbar -->
<div class="search-container">
    <form class="search-form" action="{{ url_for('search') }}" method="get">
        <input 
            type="text" 
            class="search-input" 
            name="query" 
            placeholder="Search shows, movies, albums..." 
            required
        >
        <button type="submit" class="search-btn">Search</button>
    </form>
</div>

<h1>Books in {{ collection_name }}</h1>


<div class="grid">
    {% for book in books %}
    <div class="card">
        <!-- Book cover -->
        <img src="{{ book.ImageUrl or '' }}" alt="{{ book.Name }}">

        <div class="card-body">
            <div class="title">{{ book.Name }}</div>

            <!-- Example button (you can customize or remove if not needed) -->
        <form action="{{ url_for('download_single', library_name=library_name, single_id=book['Id']) }}">
            <button class="btn">Download</button>
        </form>
        </div>
    </div>
    {% endfor %}
</div>

<br>
<a href="{{ url_for('libraries') }}">← Back to libraries</a>

</body>
</html>
